spring.application.name=regaSync
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/regasync}
spring.datasource.username=${DATABASE_USERNAME:regasync}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
spring.jackson.time-zone=UTC

app.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.mqtt.enabled=${MQTT_ENABLED:false}
app.mqtt.url=${MQTT_URL:tcp://localhost:1883}
app.mqtt.username=${MQTT_USERNAME:}
app.mqtt.password=${MQTT_PASSWORD:}
app.mqtt.device-username=${MQTT_ESP_USERNAME:esp32}

# Local demonstration only; never writes mock data to the database.
app.demo.enabled=${DEMO_ENABLED:false}

app.flow-quality.minimum=${FLOW_MIN_LPM:0.1}
app.flow-quality.maximum=${FLOW_MAX_LPM:30}
