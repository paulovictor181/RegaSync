<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head(${sensor.name})}"></head>
  <body class="flex min-h-dvh flex-col">
    <header th:replace="~{fragments/layout :: header}"></header>
    <main id="conteudo" class="mx-auto w-full max-w-6xl flex-1 px-5 py-10 sm:px-8">
      <a th:href="@{/sensores}" class="text-sm text-brand-700">← Sensores</a>
      <div class="mt-5 flex flex-wrap items-start justify-between gap-4">
        <div>
          <p class="font-mono text-sm text-brand-700" th:text="${sensor.topic()}"></p>
          <h1 class="mt-2 text-3xl font-semibold" th:text="${sensor.name}"></h1>
          <p
            class="mt-2 text-sm text-slate-500"
            th:text="${sensor.type+' · '+(sensor.active?'Ativo':'Inativo')}"
          ></p>
        </div>
        <a
          th:if="${isAdmin}"
          th:href="@{/admin/sensores/{id}/editar(id=${sensor.id})}"
          class="button-secondary"
        >
          Editar configuração
        </a>
      </div>
      <p
        class="mt-4 text-sm text-slate-500"
        th:text="${'Sensor cadastrado em '+@brazilianDates.format(sensor.createdAt)+' (Brasília)'}"
      ></p>
      <div th:replace="~{sensors/chart :: chart(${chart}, ${sensor.type.unit()})}"></div>
      <section class="mt-8 rounded-2xl border border-brand-200 bg-brand-50 p-7">
        <p class="text-sm text-brand-700">Última leitura</p>
        <p
          class="mt-2 text-4xl font-semibold"
          th:text="${latest==null?'Aguardando leitura':#numbers.formatDecimal(latest.convertedValue,1,2)+' '+latest.unit}"
        ></p>
        <time
          th:if="${latest!=null}"
          class="mt-2 block text-sm text-slate-500"
          th:text="${@brazilianDates.format(latest.measuredAt)}"
        ></time>
      </section>
      <div th:replace="~{sensors/calibration-status :: status(${sensor})}"></div>
      <h2 class="mt-10 text-xl font-semibold">Histórico de leituras</h2>
      <form
        class="mt-4 flex flex-wrap items-end gap-3 rounded-2xl border border-slate-200 bg-white p-4"
      >
        <label class="text-sm">
          De
          <input class="form-input" type="date" name="from" th:value="${from}" required />
        </label>
        <label class="text-sm">
          Até
          <input class="form-input" type="date" name="to" th:value="${to}" required />
        </label>
        <label class="text-sm">
          Ordenar por
          <select name="sort" class="form-input">
            <option value="measuredAt" th:selected="${sort == 'measuredAt'}">Medição</option>
            <option value="rawValue" th:selected="${sort == 'rawValue'}">Valor bruto</option>
            <option value="convertedValue" th:selected="${sort == 'convertedValue'}">
              Valor calculado
            </option>
          </select>
        </label>
        <label class="text-sm">
          Ordem
          <select name="direction" class="form-input">
            <option value="desc" th:selected="${direction == 'desc'}">Decrescente</option>
            <option value="asc" th:selected="${direction == 'asc'}">Crescente</option>
          </select>
        </label>
        <label class="text-sm">
          Por página
          <select name="size" class="form-input">
            <option
              th:each="n:${ {10,20,50} }"
              th:value="${n}"
              th:text="${n}"
              th:selected="${readings.size == n}"
            ></option>
          </select>
        </label>
        <button class="button-secondary">Aplicar</button>
      </form>
      <p
        class="mt-4 text-sm text-slate-500"
        th:text="${readings.totalElements+' leituras encontradas · Horário de Brasília'}"
      ></p>
      <a
        th:if="${sensor.type == T(br.com.ufersa.regasync.sensor.model.SensorType).FLUXO}"
        th:href="@{/sensores/{id}/rega-manual(id=${sensor.id})}"
        class="button-primary mt-4"
      >
        Rega manual
      </a>
      <div class="mt-4 overflow-x-auto rounded-2xl border border-slate-200 bg-white">
        <table class="w-full text-left text-sm">
          <thead class="bg-brand-50">
            <tr>
              <th class="p-4">Medição (Brasília)</th>
              <th class="p-4">Valor bruto</th>
              <th class="p-4">Valor calculado</th>
              <th class="p-4">Calibração</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="r:${readings.content}" class="border-t">
              <td class="p-4" th:text="${@brazilianDates.format(r.measuredAt)}"></td>
              <td
                class="p-4"
                th:text="${r.rawValue+(r.intervalMs==null?' ADC':' pulsos / '+r.intervalMs+' ms')}"
              ></td>
              <td
                class="p-4"
                th:text="${#numbers.formatDecimal(r.convertedValue,1,2)+' '+r.unit}"
              ></td>
              <td class="p-4" th:text="${r.calibrationVersion}"></td>
            </tr>
            <tr th:if="${readings.empty}">
              <td colspan="4" class="p-8 text-center text-slate-500">Ainda não há leituras.</td>
            </tr>
          </tbody>
        </table>
      </div>
      <nav
        th:if="${readings.totalPages > 1}"
        aria-label="Paginação das leituras"
        class="mt-6 flex items-center justify-between gap-3"
      >
        <a
          th:if="${readings.hasPrevious()}"
          class="button-secondary"
          th:href="@{/sensores/{id}(id=${sensor.id},page=${readings.number-1},size=${readings.size},from=${from},to=${to},sort=${sort},direction=${direction})}"
        >
          Anterior
        </a>
        <span
          class="text-sm text-slate-500"
          th:text="${'Página '+(readings.number+1)+' de '+readings.totalPages}"
        ></span>
        <a
          th:if="${readings.hasNext()}"
          class="button-secondary"
          th:href="@{/sensores/{id}(id=${sensor.id},page=${readings.number+1},size=${readings.size},from=${from},to=${to},sort=${sort},direction=${direction})}"
        >
          Próxima
        </a>
      </nav>
    </main>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/sensor-calibration.js}" defer></script>
  </body>
</html>
