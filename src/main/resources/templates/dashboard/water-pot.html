<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <body>
    <article
      th:fragment="pot(title, liters, percent, key)"
      class="rounded-2xl border border-slate-200 bg-white p-6 text-center"
    >
      <h3 class="text-lg font-semibold" th:text="${title}"></h3>
      <svg
        viewBox="0 0 200 220"
        role="img"
        th:aria-label="${title+': '+#numbers.formatDecimal(liters,1,'POINT',3,'COMMA')+' litros, '+#numbers.formatDecimal(percent,1,'POINT',2,'COMMA')+'% do total'}"
        class="mx-auto mt-4 h-48 w-44"
      >
        <defs>
          <clipPath th:id="${key}">
            <rect x="30" y="35" width="120" height="160" rx="22" />
          </clipPath>
        </defs>
        <path
          d="M150 65 H163 C192 65 192 132 163 132 H150"
          fill="none"
          stroke="#94a3b8"
          stroke-width="8"
        />
        <rect x="30" y="35" width="120" height="160" rx="22" fill="#f1f5f9" />
        <g th:attr="clip-path=${'url(#'+key+')'}">
          <rect
            x="30"
            width="120"
            th:y="${195-percent.doubleValue()*1.6}"
            th:height="${percent.doubleValue()*1.6}"
            fill="#38bdf8"
          />
          <line
            x1="30"
            x2="150"
            th:y1="${195-percent.doubleValue()*1.6}"
            th:y2="${195-percent.doubleValue()*1.6}"
            stroke="#0284c7"
            stroke-width="2"
            th:if="${percent.signum()>0}"
          />
        </g>
        <rect
          x="30"
          y="35"
          width="120"
          height="160"
          rx="22"
          fill="none"
          stroke="#64748b"
          stroke-width="3"
        />
        <rect
          x="25"
          y="24"
          width="130"
          height="15"
          rx="6"
          fill="#cbd5e1"
          stroke="#64748b"
          stroke-width="2"
        />
        <path d="M45 75 H60 M45 115 H60 M45 155 H60" stroke="#64748b" stroke-width="2" />
      </svg>
      <p
        class="mt-3 text-3xl font-semibold text-brand-900"
        th:text="${#numbers.formatDecimal(liters,1,'POINT',3,'COMMA')+' L'}"
      ></p>
      <p
        class="mt-2 text-sm text-slate-500"
        th:text="${#numbers.formatDecimal(percent,1,'POINT',2,'COMMA')+'% do consumo total'}"
      ></p>
    </article>
  </body>
</html>
