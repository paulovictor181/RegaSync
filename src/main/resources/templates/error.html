<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Não foi possível continuar')}"></head>
  <body class="flex min-h-dvh items-center justify-center px-6 py-12">
    <main
      class="w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-xs sm:p-12"
    >
      <p class="text-sm font-semibold tracking-widest text-brand-600" th:text="${status}">Erro</p>
      <h1 class="mt-4 text-2xl font-semibold tracking-tight text-slate-900">
        Não foi possível continuar.
      </h1>
      <p class="mt-4 text-sm leading-7 text-slate-500">
        A página pode não estar disponível. Volte ao início e tente novamente.
      </p>
      <a th:href="@{/}" class="button-primary mt-8">
        Voltar ao início
        <span aria-hidden="true">→</span>
      </a>
    </main>
  </body>
</html>
