services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${DATABASE_NAME:-regasync}
      MQTT_ENABLED: "true"
      MQTT_URL: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_SERVER_USERNAME:-regasync-server}
      MQTT_PASSWORD: ${MQTT_SERVER_PASSWORD:?Defina MQTT_SERVER_PASSWORD no .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-regasync}
      POSTGRES_USER: ${DATABASE_USERNAME:-regasync}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  mosquitto:
    image: eclipse-mosquitto:2
    environment:
      MQTT_SERVER_USERNAME: ${MQTT_SERVER_USERNAME:-regasync-server}
      MQTT_SERVER_PASSWORD: ${MQTT_SERVER_PASSWORD:?Defina MQTT_SERVER_PASSWORD no .env}
      MQTT_ESP_USERNAME: ${MQTT_ESP_USERNAME:-esp32}
      MQTT_ESP_PASSWORD: ${MQTT_ESP_PASSWORD:?Defina MQTT_ESP_PASSWORD no .env}
    entrypoint: ["/bin/sh", "/bootstrap/start.sh"]
    volumes:
      - ./mosquitto:/bootstrap:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "127.0.0.1:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u \"$$MQTT_SERVER_USERNAME\" -P \"$$MQTT_SERVER_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  mosquitto_data:
